name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE="claude-kit-${VERSION}.tar.gz"

          # git archive respects .gitattributes export-ignore — no manual exclusion needed
          git archive \
            --format=tar.gz \
            --prefix="claude-kit-${VERSION}/" \
            --output="${ARCHIVE}" \
            HEAD

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Verify tarball contents
        run: |
          set -eo pipefail
          ENTRIES="$(tar tzf "${ARCHIVE}")"
          GITV="$(git --version)"
          COUNT="$(grep -c '' <<< "$ENTRIES" || true)"
          # Surface env facts as a run annotation + job summary (readable without log access).
          echo "::notice::release verify — ${GITV}; ${COUNT} tarball entries"
          {
            echo "### Release tarball verify"
            echo ""
            echo "- git: \`${GITV}\`"
            echo "- entries: \`${COUNT}\`"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          echo "=== Tarball contents (first 60) ==="
          head -n 60 <<< "$ENTRIES"
          echo ""
          echo "=== Checking excluded paths are absent ==="
          # These paths must NOT appear in the tarball.
          # Trailing "/" denotes a directory (matches the dir entry or any contained file).
          # Bare names match the full final path component (anchored at "/" and end-of-line),
          # so e.g. ".claude/PROJECT-KNOWLEDGE.md" does NOT match "...md.example".
          EXCLUDED=(
            ".claude/PROJECT-KNOWLEDGE.md"
            ".claude/workflow-state/"
            ".claude/prompts/"
            ".claude/agent-memory/"
            ".DS_Store"
            ".gitkeep"
            "superpowers-main/"
            ".github/"
          )
          FAILED=0
          for path in "${EXCLUDED[@]}"; do
            esc="$(printf '%s' "$path" | sed 's/[][\.*^$()+?{}|/]/\\&/g')"
            if [[ "$path" == */ ]]; then
              # Directory: match path-prefix (dir entry itself or any contained file)
              pattern="/${esc}"
            else
              # File: match end-of-entry exactly
              pattern="/${esc}\$"
            fi
            # here-string (no pipe) → deterministic; avoids the SIGPIPE/pipefail
            # interaction that an early-exiting `grep -q` in a pipeline can trigger.
            matches="$(grep -E "$pattern" <<< "$ENTRIES" || true)"
            if [ -n "$matches" ]; then
              # ::error:: surfaces the offending path as a run annotation.
              echo "::error::excluded path found in tarball: ${path}"
              printf '%s\n' "$matches" | sed 's/^/  /'
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::tarball contains excluded paths — aborting release"
            exit 1
          fi
          echo "All exclusion checks passed."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            curl -sL https://raw.githubusercontent.com/hex0xdeadbeef/claude-kit/main/install.sh | bash
            ```

            ## Update existing installation

            ```bash
            bash install.sh --update
            ```

            ## Specific version

            ```bash
            KIT_VERSION=${{ steps.version.outputs.VERSION }} bash install.sh
            ```

            See [README.md](https://github.com/hex0xdeadbeef/claude-kit#readme) for full documentation.
